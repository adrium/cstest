name: Build

on:
  push:
    branches: [main]

jobs:

  build:
    runs-on: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: install dependencies
      run: |
        sudo apt update
        sudo apt install -y xvfb keepass2
        curl -L -o kp.zip https://sourceforge.net/projects/keepass/files/KeePass%202.x/2.18/KeePass-2.18.zip/download
        unzip -d build kp.zip
    - run: dotnet build -c Release src
    - name: plgx create
      run: |
        cp -rv assets output
        cat src/*.cs | grep ^using | sort -u > output/Plugin.cs
        cat src/*.cs | grep ^.assembly: >> output/Plugin.cs
        cat src/*.cs | grep -Ev '^(using|.assembly:)' >> output/Plugin.cs
        xvfb-run keepass2 -plgx-create $PWD/output
    - run: cat output/Plugin.cs
    - uses: actions/upload-artifact@v4
      with:
        path: output.plgx
    - uses: actions/upload-artifact@v4
      with:
        path: src/bin/Debug/*/
